.tm-boot-ring::after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,.08);border-bottom-color:rgba(79,208,160,.75);animation:tmBootSpinReverse 1.8s linear infinite}
.tm-boot-brand{margin-top:22px;font-size:18px;font-weight:950;letter-spacing:2.8px;text-shadow:0 0 25px rgba(90,210,255,.25)}
.tm-boot-brand span{color:#4fd0a0}
.tm-boot-line{margin-top:6px;font-size:9px;letter-spacing:3px;color:#91a9b5}
.tm-boot-status{margin-top:28px;font-size:8px;letter-spacing:1.5px;color:#718892}
.tm-boot-progress{margin-top:10px;width:190px;height:2px;background:rgba(255,255,255,.07);overflow:hidden;border-radius:99px}
.tm-boot-progress i{display:block;width:42%;height:100%;background:linear-gradient(90deg,transparent,#62d7ff,#4fd0a0,transparent);animation:tmBootProgress 1.4s ease-in-out infinite}
@keyframes tmBootSpin{to{transform:rotate(360deg)}}
@keyframes tmBootSpinReverse{to{transform:rotate(-360deg)}}
@keyframes tmBootProgress{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}
@media(max-width:800px){#status.tm-show{left:6px;top:52px;max-width:calc(100vw - 12px)}}
