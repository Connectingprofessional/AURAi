<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackMeNow — Global Intelligence</title>
<link rel="stylesheet" href="./vendor/maplibre-gl/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;width:100%}
body{overflow:hidden;background:#05090d;color:#edf4f8;font-family:system-ui,sans-serif}
#map{position:fixed;inset:0;z-index:1;background:#0a1520}
.topbar{position:fixed;z-index:1200;top:12px;left:14px;right:14px;height:46px;display:flex;align-items:center;gap:9px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{height:38px;display:flex;align-items:center;padding:0 12px;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:rgba(7,11,16,.78);font-size:12px;font-weight:950;letter-spacing:1.8px}
.brand span{color:#45a8ff}
.search{height:38px;display:flex;flex:1;max-width:520px;margin:auto;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:rgba(7,11,16,.78);overflow:hidden}
.search input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:0 13px;font-size:11px}
.btn{height:38px;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:rgba(7,11,16,.78);color:#eaf4fa;padding:0 12px;font-size:10px;font-weight:800;cursor:pointer}
.search .btn{border:0;border-left:1px solid rgba(255,255,255,.13);border-radius:0;background:rgba(69,168,255,.13);color:#9fd2ff}
.status{position:fixed;z-index:1150;left:14px;bottom:12px;padding:7px 9px;border:1px solid rgba(255,255,255,.13);border-radius:7px;background:rgba(7,11,16,.78);font-size:10px;color:#b9c9d2}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="brand">TRACK<span>ME</span>NOW</div>
  <div class="search">
    <input id="searchInput" placeholder="Search place, device, Cell ID, MCC/MNC, mobile number…" />
    <button class="btn" id="searchBtn" type="button">Search</button>
  </div>
  <button class="btn" id="accessBtn" type="button">ACCESS</button>
  <button class="btn" id="gpsBtn" type="button">GPS</button>
</div>
<div id="status" class="status">Starting…</div>
<script src="./vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="./trackmenow.js?v=transport-2"></script>
<script>
(function(){
  var input=document.getElementById('searchInput');
  var btn=document.getElementById('searchBtn');
  var gps=document.getElementById('gpsBtn');
  var access=document.getElementById('accessBtn');
  function go(){
    var q=(input&&input.value||'').trim();
    if(!q||!window.map||!window.map.flyTo) return;
    if(/^\\+?[0-9][0-9 ()-]{6,18}$/.test(q)){ mobileLookup(q); return; }
    if(window.tmFindObject){ window.tmFindObject(q).then(function(found){ if(!found) geocode(q); }).catch(function(){ geocode(q); }); return; }
    geocode(q);
  }
  function geocode(q){
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))
      .then(function(r){return r.json()})
      .then(function(j){
        if(!j||!j[0]) return;
        window.map.flyTo({center:[parseFloat(j[0].lon),parseFloat(j[0].lat)],zoom:10,duration:1200});
      }).catch(function(){});
  }
  function mobileLookup(q){
    /*
      PHONE-ONLY SELF TEST:
      The phone number is only the search input. GPS permission is requested
      for THIS browser/device. It does not locate another person by number.
    */
    if(!navigator.geolocation){
      setMobileStatus('GPS is unavailable in this browser.');
      return;
    }
    setMobileStatus('Requesting GPS permission for this device…');
    navigator.geolocation.getCurrentPosition(function(p){
      var lat=p.coords.latitude, lon=p.coords.longitude;
      window.map.flyTo({center:[lon,lat],zoom:15,duration:1400});
      setMobileStatus('PHONE TEST: '+q+' — this browser/device is at '+lat.toFixed(6)+', '+lon.toFixed(6));
    },function(err){
      var msg='GPS permission was not granted.';
      if(err && err.code===2) msg='This device could not determine its GPS position.';
      if(err && err.code===3) msg='GPS request timed out. Try again.';
      setMobileStatus(msg+' Phone-number lookup will require registration/authorization.');
    },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }
  function setMobileStatus(msg){ var s=document.getElementById('status'); if(s) s.textContent=msg; }
  if(btn) btn.onclick=go;
  if(access) access.onclick=function(){ sessionStorage.removeItem('tmViewerToken'); setMobileStatus('Viewer access token cleared.'); };
  if(input) input.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  if(gps) gps.onclick=function(){
    if(!navigator.geolocation||!window.map) return;
    navigator.geolocation.getCurrentPosition(function(p){
      window.map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:12,duration:1000});
    });
  };
})();
</script>
</body>
</html>
