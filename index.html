<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<meta name="color-scheme" content="dark">
<meta name="description" content="TrackMeNow — live GPS tracking, satellite map, transport intelligence, public cell data and location history.">
<title>TrackMeNow — Global Intelligence</title>
<link rel="preconnect" href="https://server.arcgisonline.com">
<link rel="preconnect" href="https://gibs.earthdata.nasa.gov">
<link rel="stylesheet" href="./vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="./visuals.css?v=trackmenow-live-16">
<style>
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;background:#05080c;color:#edf4f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{overscroll-behavior:none}
#map-bg-scan{position:fixed;inset:0;z-index:0;pointer-events:none;background:#050810;
  background-image:linear-gradient(rgba(11,211,211,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(11,211,211,.045) 1px,transparent 1px);
  background-size:48px 48px}
#map{position:fixed!important;inset:0 0 var(--tm-dock-h,76px) 0!important;z-index:1;background:transparent!important}
.maplibregl-canvas{background:transparent!important}
#legacy-controls{display:none!important}
#status{display:none!important}\n#tm-media-rail{position:fixed;left:10px;top:64px;z-index:6900;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:auto}\n#tm-media-rail>button:not(#tm-media-clear){width:52px;height:30px;border:1px solid rgba(180,220,240,.2);border-radius:6px;background:rgba(4,9,14,.9);color:#dff2ff;font-size:8px;font-weight:900;letter-spacing:.4px;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.28);backdrop-filter:blur(10px)}\n#tm-media-rail>button:not(#tm-media-clear):hover{background:rgba(69,168,255,.2);border-color:rgba(69,168,255,.45)}\n#tm-media-preview{width:72px;max-height:105px;overflow:hidden;border:1px solid rgba(180,220,240,.2);border-radius:7px;background:rgba(4,9,14,.92);box-shadow:0 5px 18px rgba(0,0,0,.35)}\n#tm-media-preview img,#tm-media-preview video{display:block;width:100%;height:auto;max-height:104px;object-fit:cover}\n#tm-media-clear{width:22px;height:22px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(4,9,14,.92);color:#fff;font-size:15px;line-height:18px;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.28)}\n@media(max-width:800px){#tm-media-rail{left:6px;top:56px}#tm-media-rail>button:not(#tm-media-clear){width:48px;height:28px;font-size:7px}}
#tm-bottom-bar{display:none!important;height:0!important;overflow:hidden!important;pointer-events:none!important}
#tm-timebar{bottom:calc(var(--tm-dock-h,76px) + 10px)!important;z-index:5000!important}
#tm-shell{z-index:6000!important}
#tm-panel.open{z-index:6100!important}
#tm-time-slider{accent-color:#45a8ff}

/* Integrated boot/splash: adapted from the supplied ARGOS shell without replacing TrackMeNow's runtime. */
#tm-boot{background:radial-gradient(circle at 50% 44%,rgba(11,211,211,.07),rgba(2,6,10,.98) 58%,#010204)}
#tm-boot::before{content:"";position:absolute;inset:8%;border:1px solid rgba(11,211,211,.08);border-radius:50%;box-shadow:0 0 110px rgba(11,211,211,.06) inset}
#tm-boot .tm-boot-brand{text-shadow:0 0 18px rgba(11,211,211,.35)}
#tm-boot .tm-boot-line{color:#0bd3d3}
#tm-boot .tm-boot-progress i{background:linear-gradient(90deg,transparent,#0bd3d3,#8affff,transparent)}
@media(max-width:800px){
  #status.tm-show{left:6px;top:52px;max-width:calc(100vw - 12px)}
}
</style>
</head>
<body>
<div id="tm-boot" aria-live="polite">
  <div class="tm-boot-ring"></div>
  <div class="tm-boot-brand">TRACK<span>ME</span>NOW</div>
  <div class="tm-boot-line">GLOBAL INTELLIGENCE</div>
  <div class="tm-boot-status" id="tm-boot-status">INITIALIZING MAP DATA</div>
  <div class="tm-boot-progress"><i></i></div>
</div>
<div id="map-bg-scan" aria-hidden="true"></div>
<div id="map"></div>
<div id="legacy-controls"></div>
<div id="status">Starting…</div>\n<div id="tm-media-rail" aria-label="Photo and video upload">
  <button id="tm-media-photo" type="button" title="Upload photo" aria-label="Upload photo">PHOTO</button>
  <button id="tm-media-video" type="button" title="Upload video" aria-label="Upload video">VIDEO</button>
  <input id="tm-media-photo-input" type="file" accept="image/*" hidden>
  <input id="tm-media-video-input" type="file" accept="video/*" hidden>
  <div id="tm-media-preview" hidden></div>
  <button id="tm-media-clear" type="button" title="Remove uploaded media" aria-label="Remove uploaded media" hidden>×</button>
</div>

<script src="./vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="./trackmenow-transport-fix.js?v=16"></script>
<script src="./trackmenow-traffic.js?v=16"></script>
<script src="./trackmenow-ux-fix.js?v=16"></script>
<script src="./trackmenow-panel-fix.js?v=16"></script>
<script src="./trackmenow-timebar-fix.js?v=16"></script>
<script src="./trackmenow.js?v=trackmenow-live-16"></script>
<script src="./visuals-ui.js?v=trackmenow-live-16"></script>
<script src="./trackmenow-map-runtime.js?v=1"></script>
</body>
</html>
