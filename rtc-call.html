<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackMeNow — Secure WebRTC Room</title>
<style>body{margin:0;background:#05090d;color:#edf4f8;font:14px system-ui;display:grid;place-items:center;min-height:100vh}.app{width:min(980px,94vw)}h2{letter-spacing:.5px}.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}input,button{height:38px;border-radius:8px;border:1px solid #31404b;background:#0b1219;color:#fff;padding:0 12px}button{cursor:pointer}.videos{display:flex;gap:12px}.videos video{width:50%;height:380px;background:#020508;border-radius:12px;object-fit:cover}.state{margin-top:10px;color:#9fb2bd}.hint{font-size:11px;color:#738893;margin-top:8px}</style></head>
<body><main class="app"><h2>TrackMeNow Communication</h2><div class="row"><input id="room" value="default-room" placeholder="Room ID"><button id="join">JOIN</button><button id="leave">LEAVE</button><button id="mute">MUTE</button><button id="camera">CAMERA OFF</button></div><div class="videos"><video id="local" autoplay playsinline muted></video><video id="remote" autoplay playsinline></video></div><div id="state" class="state">Waiting for permission and a second participant.</div><div class="hint">Peer-to-peer media. TrackMeNow uses its Worker/D1 service only for temporary signaling messages; media is not stored.</div></main>
<script>
const API=location.origin;let stream=null,pc=null,peerId=null,remoteId=null,room=null,pollTimer=null,muted=false,cameraOff=false,iceQueue=[];
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];const $=id=>document.getElementById(id);const state=m=>$('state').textContent=m;
async function api(path,opt){const r=await fetch(API+path,Object.assign({cache:'no-store',headers:{'Content-Type':'application/json'}},opt||{}));const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}
async function signal(type,payload){if(!remoteId)return;await api('/api/call/signal',{method:'POST',body:JSON.stringify({room,from:peerId,to:remoteId,type,payload})})}
function makePeer(){pc=new RTCPeerConnection({iceServers:ICE});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(e.streams[0])$('remote').srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate.toJSON()).catch(()=>{})};pc.onconnectionstatechange=()=>state('Connection: '+pc.connectionState)}
async function handle(m){if(m.type==='offer'){remoteId=m.from;if(!pc)makePeer();await pc.setRemoteDescription(m.payload);const a=await pc.createAnswer();await pc.setLocalDescription(a);await signal('answer',pc.localDescription)}else if(m.type==='answer'){if(!pc)return;await pc.setRemoteDescription(m.payload);while(iceQueue.length)await pc.addIceCandidate(iceQueue.shift())}else if(m.type==='ice'&&m.payload){if(pc&&pc.remoteDescription)await pc.addIceCandidate(m.payload);else iceQueue.push(m.payload)}}
async function poll(){try{const j=await api('/api/call/poll?room='+encodeURIComponent(room)+'&peer='+encodeURIComponent(peerId));for(const m of j.signals||[])await handle(m)}catch(e){}}
async function join(){if(pollTimer)return;room=$('room').value.trim()||'default-room';stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream;const j=await api('/api/call/join',{method:'POST',body:JSON.stringify({room})});peerId=j.peerId;remoteId=j.remotePeerId||null;makePeer();pollTimer=setInterval(poll,500);state(j.remotePeerId?(j.initiator?'Peer found. Creating secure offer…':'Peer found. Waiting for offer…'):'Room joined. Waiting for another participant…');if(j.initiator){const o=await pc.createOffer();await pc.setLocalDescription(o);await signal('offer',pc.localDescription)}}
async function leave(){if(!pollTimer)return;clearInterval(pollTimer);pollTimer=null;try{await api('/api/call/leave',{method:'POST',body:JSON.stringify({room,peer:peerId})})}catch(e){}if(pc)pc.close();pc=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;iceQueue=[];$('local').srcObject=null;$('remote').srcObject=null;state('Left room.')}
$('join').onclick=()=>join().catch(e=>state('Unable to join: '+e.message));$('leave').onclick=()=>leave();$('mute').onclick=()=>{muted=!muted;if(stream)stream.getAudioTracks().forEach(t=>t.enabled=!muted);$('mute').textContent=muted?'UNMUTE':'MUTE'};$('camera').onclick=()=>{cameraOff=!cameraOff;if(stream)stream.getVideoTracks().forEach(t=>t.enabled=!cameraOff);$('camera').textContent=cameraOff?'CAMERA ON':'CAMERA OFF'};
</script></body></html>
