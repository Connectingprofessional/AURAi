<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackMeNow WebRTC</title>
<style>body{margin:0;background:#05090d;color:#edf4f8;font:14px system-ui;display:grid;place-items:center;min-height:100vh}.app{width:min(900px,94vw)}input,button{height:38px;border-radius:8px;border:1px solid #31404b;background:#0b1219;color:#fff;padding:0 12px}button{cursor:pointer}.row{display:flex;gap:8px;margin:12px 0}.videos{display:flex;gap:12px}.videos video{width:50%;height:360px;background:#020508;border-radius:12px;object-fit:cover}.state{margin-top:10px;color:#9fb2bd}</style></head>
<body><main class="app"><h2>TrackMeNow WebRTC</h2><div class="row"><input id="room" value="default-room" placeholder="Room ID"><button id="join">Join</button><button id="leave">Leave</button><button id="mute">Mute</button><button id="camera">Camera Off</button></div><div class="videos"><video id="local" autoplay playsinline muted></video><video id="remote" autoplay playsinline></video></div><div id="state" class="state">Signaling uses TrackMeNow /ws. Media is peer-to-peer.</div></main>
<script>
let ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
let ws,stream,pc,peerId,remoteId,room,muted=false,cameraOff=false,iceQueue=[];
const $=id=>document.getElementById(id); const state=m=>$('state').textContent=m;
function wsUrl(){const p=location.protocol==='https:'?'wss:':'ws:';return p+'//'+location.host+'/ws?room='+encodeURIComponent(room)+'&role=viewer'}
function send(m){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(m))}
function makePeer(){pc=new RTCPeerConnection({iceServers:ICE});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$('remote').srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)send({type:'ice',to:remoteId,candidate:e.candidate})};pc.onconnectionstatechange=()=>state('Connection: '+pc.connectionState)}
async function loadIce(){try{const r=await fetch('/api/call-config',{cache:'no-store'});const j=await r.json();if(Array.isArray(j.iceServers)&&j.iceServers.length)ICE=j.iceServers;}catch(e){}}\nasync function join(){if(ws)return;await loadIce();room=$('room').value.trim()||'default-room';stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream;ws=new WebSocket(wsUrl());ws.onopen=()=>state('Connected to signaling server. Waiting for another participant…');ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='ready'){peerId=m.peerId}else if(m.type==='viewer-join'){remoteId=m.peerId;makePeer();const offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:'offer',to:remoteId,sdp:pc.localDescription})}else if(m.type==='offer'){remoteId=m.from;if(!pc)makePeer();await pc.setRemoteDescription(m.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);send({type:'answer',to:remoteId,sdp:pc.localDescription})}else if(m.type==='answer'){await pc.setRemoteDescription(m.sdp);while(iceQueue.length)try{await pc.addIceCandidate(iceQueue.shift())}catch(err){}}else if(m.type==='ice'&&m.candidate){if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch(err){}else iceQueue.push(m.candidate)};ws.onclose=()=>state('Signaling disconnected.');}
function leave(){iceQueue=[];if(ws)ws.close();ws=null;if(pc)pc.close();pc=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('local').srcObject=null;$('remote').srcObject=null;state('Left room.')}
$('join').onclick=()=>join().catch(e=>state('Camera/microphone error: '+e.message));$('leave').onclick=leave;
$('mute').onclick=()=>{muted=!muted;if(stream)stream.getAudioTracks().forEach(t=>t.enabled=!muted);$('mute').textContent=muted?'Unmute':'Mute'};
$('camera').onclick=()=>{cameraOff=!cameraOff;if(stream)stream.getVideoTracks().forEach(t=>t.enabled=!cameraOff);$('camera').textContent=cameraOff?'Camera On':'Camera Off'};
</script></body></html>
