name = "wispy-bush-9aee"          # same name as your existing Worker, so the URL stays the same
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://connectingprofessional.github.io,http://localhost:8080,http://127.0.0.1:8080"
RETENTION_DAYS = "7"
# Optional comma-separated public/authorized visual source URLs. Media is never stored.
VISUALS_PUBLIC_SOURCE_URLS = ""

[[d1_databases]]
binding = "DB"
database_name = "trackmenow-devices"
database_id = "68be1d07-3168-4765-8a7d-ff2e4a72394f"

# Secrets (never put values in this file): npx wrangler secret put OPENCELLID_API_KEY; npx wrangler secret put ADMIN_USER; npx wrangler secret put ADMIN_PASSWORD
