name: Deploy TrackMeNow (MapLibre) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'   # refresh the NASA data every 3 hours

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trackmenow-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site (MapLibre Global Intelligence only)
        run: |
          mkdir -p _site
          # Core UI
          cp index.html _site/
          cp trackmenow.js trackmenow-globe-engine.js trackmenow-icons.js water-effect.js _site/ 2>/dev/null || true
          # Vendor MapLibre
          mkdir -p _site/vendor/maplibre-gl
          cp -r vendor/maplibre-gl/* _site/vendor/maplibre-gl/
          # Optional docs
          cp README.md _site/ 2>/dev/null || true
          # Exclude Node server & secrets from static publish
          echo "Static artifact ready"
          find _site -type f | head -40

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch NASA data (Horizons, Small-Body DB, CNEOS, Exoplanet Archive)
        continue-on-error: true
        run: |
          node scripts/fetch-nasa-data.mjs _site/data/nasa.json || true
          mkdir -p _site/data
          [ -s _site/data/nasa.json ] || echo '{"meta":{"error":"fetch script did not run"}}' > _site/data/nasa.json
          ls -la _site/data

      - name: Commit refreshed NASA data (keeps branch-built Pages in sync)
        continue-on-error: true
        run: |
          if grep -q '"spacecraft":\[' _site/data/nasa.json; then
            mkdir -p data && cp _site/data/nasa.json data/nasa.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/nasa.json
            git diff --cached --quiet || { git commit -m "Refresh NASA data [skip ci]" && git pull --rebase origin main && git push origin main; }
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
