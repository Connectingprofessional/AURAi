name: Deploy TrackMeNow to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: trackmenow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static TrackMeNow site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/vendor/maplibre-gl

          # Parse-check the browser scripts before anything is published.
          for f in *.js; do
            case "$f" in
              vendor/*) continue ;;
            esac
            node --check "$f"
          done

          cp index.html _site/index.html
          cp trackmenow-cameras.js _site/trackmenow-cameras.js
          cp admin.html _site/admin.html
          cp trackmenow.js _site/trackmenow.js
          cp trackmenow-transport-fix.js _site/trackmenow-transport-fix.js
          cp trackmenow-traffic.js _site/trackmenow-traffic.js
          cp trackmenow-ux-fix.js _site/trackmenow-ux-fix.js
          cp trackmenow-panel-fix.js _site/trackmenow-panel-fix.js
          cp trackmenow-timebar-fix.js _site/trackmenow-timebar-fix.js
          cp trackmenow-map-runtime.js _site/trackmenow-map-runtime.js
          cp trackmenow-earth-camera.js _site/trackmenow-earth-camera.js
          cp trackmenow-buildings.js _site/trackmenow-buildings.js
          cp trackmenow-streetview.js _site/trackmenow-streetview.js
          cp trackmenow-globe-engine.js _site/trackmenow-globe-engine.js
          cp trackmenow-icons.js _site/trackmenow-icons.js
          cp water-effect.js _site/water-effect.js
          cp visuals-ui.js _site/visuals-ui.js
          cp visuals.css _site/visuals.css
          mkdir -p _site/data
          if [ -f data/nasa.json ]; then cp data/nasa.json _site/data/nasa.json; fi
          cp rtc-call.html _site/rtc-call.html
          cp -r vendor/maplibre-gl/. _site/vendor/maplibre-gl/

          test -s _site/index.html
          test -s _site/visuals-ui.js
          test -s _site/visuals.css
          test -s _site/trackmenow.js
          test -s _site/trackmenow-cameras.js
          test -s _site/trackmenow-earth-camera.js
          test -s _site/trackmenow-buildings.js
          test -s _site/trackmenow-streetview.js
          test -s _site/vendor/maplibre-gl/maplibre-gl.js

          echo "TrackMeNow Pages artifact:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy TrackMeNow
        id: deployment
        uses: actions/deploy-pages@v4
