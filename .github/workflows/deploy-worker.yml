name: Deploy Cloudflare Worker

# Removes the manual copy-paste step: whenever cloudflare/worker.js or wrangler.toml change on main,
# this publishes them to the real wispy-bush-9aee Worker, so the live backend always matches this repo.
# One-time setup (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - a token with "Edit Cloudflare Workers" permission (My Profile -> API Tokens)
#   CLOUDFLARE_ACCOUNT_ID - Workers & Pages -> Overview -> Account ID (right sidebar)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker.js'
      - 'cloudflare/wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync transport secrets to Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          MOBILITY_DB_REFRESH_TOKEN: ${{ secrets.MOBILITY_DB_REFRESH_TOKEN }}
          DELHI_OTD_API_KEY: ${{ secrets.DELHI_OTD_API_KEY }}
          N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}
          OPENCELLID_API_KEY: ${{ secrets.OPENCELLID_API_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.TM_GOOGLE_MAPS_API_KEY || secrets.TM_GOOGLE_MAPS_3D_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AISSTREAM_API_KEY:-}" ]; then printf '%s' "$AISSTREAM_API_KEY" | npx wrangler@latest secret put AISSTREAM_API_KEY; fi
          if [ -n "${AVIATIONSTACK_API_KEY:-}" ]; then printf '%s' "$AVIATIONSTACK_API_KEY" | npx wrangler@latest secret put AVIATIONSTACK_API_KEY; fi
          if [ -n "${MOBILITY_DB_REFRESH_TOKEN:-}" ]; then printf '%s' "$MOBILITY_DB_REFRESH_TOKEN" | npx wrangler@latest secret put MOBILITY_DB_REFRESH_TOKEN; fi
          if [ -n "${DELHI_OTD_API_KEY:-}" ]; then printf '%s' "$DELHI_OTD_API_KEY" | npx wrangler@latest secret put DELHI_OTD_API_KEY; fi
          if [ -n "${N2YO_API_KEY:-}" ]; then printf '%s' "$N2YO_API_KEY" | npx wrangler@latest secret put N2YO_API_KEY; fi
          if [ -n "${OPENCELLID_API_KEY:-}" ]; then printf '%s' "$OPENCELLID_API_KEY" | npx wrangler@latest secret put OPENCELLID_API_KEY; fi
          if [ -n "${ADMIN_USER:-}" ]; then printf '%s' "$ADMIN_USER" | npx wrangler@latest secret put ADMIN_USER; fi
          if [ -n "${ADMIN_PASSWORD:-}" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler@latest secret put ADMIN_PASSWORD; fi
          if [ -n "${GOOGLE_MAPS_API_KEY:-}" ]; then printf '%s' "$GOOGLE_MAPS_API_KEY" | npx wrangler@latest secret put GOOGLE_MAPS_API_KEY; fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy

      - name: Smoke-test live Worker and Google key configuration
        env:
          WORKER_URL: https://wispy-bush-9aee.recreationeeraj.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 45 "$WORKER_URL/health" > /tmp/health.json
          curl --fail --silent --show-error --max-time 15 "$WORKER_URL/api/google/maps-config" > /tmp/google-config.json
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); const g=JSON.parse(fs.readFileSync('/tmp/google-config.json','utf8')); console.log('Worker health:',h.ok?'OK':'NOT OK'); console.log('Google browser key configured:',!!g.configured); if(!h.ok)process.exit(1); if(!g.configured) { console.error('Missing Worker secret GOOGLE_MAPS_API_KEY; check GOOGLE_MAPS_API_KEY, TM_GOOGLE_MAPS_API_KEY, or TM_GOOGLE_MAPS_3D_API_KEY GitHub Actions secrets.'); process.exit(1); }"
          # External mobility/camera providers can be slow or rate-limited; test them without blocking key deployment.
          curl --fail --silent --show-error --max-time 15 "$WORKER_URL/api/movement?bbox=76.7,28.4,77.5,28.9&layers=flights,ships,transit,rail,taxi,bike,car" > /tmp/movement.json || echo "::warning::Movement source probe timed out or was unavailable."
          curl --fail --silent --show-error --max-time 15 "$WORKER_URL/api/cameras?bbox=76.7,28.4,77.5,28.9" > /tmp/cameras.json || echo "::warning::Camera source probe timed out or was unavailable."
          node -e "for (const f of ['/tmp/movement.json','/tmp/cameras.json']) { if(fsExists(f)) { try { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log(f,'JSON OK'); } catch(e) { console.log(f,'non-JSON/empty provider response; see warning'); } } } function fsExists(f){try{return require('fs').statSync(f).size>0}catch(e){return false}}"
