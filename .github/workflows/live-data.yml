name: Live transport data
# Collects aircraft, ships and transit vehicles every ~6 minutes (each run loops for ~1 hour; hourly cron restarts it) and publishes them on the
# `live-data` branch (files: flights.json, ships.json, transit.json, meta.json). The site reads them from there.
# Secrets (Settings -> Secrets and variables -> Actions): AISSTREAM_API_KEY, MOBILITY_DB_REFRESH_TOKEN
on:
  schedule:
    - cron: '7 * * * *'   # hourly safety net: GitHub often skips frequent schedules, so each run loops by itself
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --no-save --no-audit --no-fund ws gtfs-realtime-bindings
      - name: Collect and publish every 6 minutes for about an hour
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          MOBILITY_DB_REFRESH_TOKEN: ${{ secrets.MOBILITY_DB_REFRESH_TOKEN }}
          AIS_SECONDS: '90'
          GH_PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p out
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch --depth=1 origin live-data
            for f in flights ships transit; do git show FETCH_HEAD:$f.json > out/$f.json 2>/dev/null || rm -f out/$f.json; done
          fi
          END=$(( $(date +%s) + 3300 ))
          while true; do
            START=$(date +%s)
            node scripts/fetch-live.mjs out || echo "collector failed, keeping previous files"
            ( cd out && rm -rf .git && git init -q -b live-data && git add -A \
              && git commit -q -m "Live data $(date -u +%FT%TZ)" \
              && git push -q -f "$GH_PUSH_URL" live-data ) || echo "publish failed"
            rm -rf out/.git
            [ $(date +%s) -ge $END ] && break
            LEFT=$(( 360 - ( $(date +%s) - START ) ))
            [ $LEFT -gt 0 ] && sleep $LEFT
          done
