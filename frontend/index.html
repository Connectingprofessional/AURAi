<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TrackMeNow — Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map{height:100%;margin:0} body{overflow:hidden;background:#0b1118;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .top{position:fixed;z-index:1000;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;width:min(760px,calc(100% - 28px));padding:8px;border-radius:14px;background:rgba(12,18,25,.88);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
    input{flex:1;min-width:0;border:0;outline:0;border-radius:9px;padding:12px;background:#17222d;color:#fff;font-size:14px}.btn{border:0;border-radius:9px;padding:0 14px;background:#1f7aff;color:#fff;font-weight:700;cursor:pointer}.btn.stop{background:#a92f3a}
    .status{position:fixed;z-index:1000;left:14px;bottom:14px;padding:9px 12px;border-radius:10px;background:rgba(12,18,25,.86);color:#dce7f2;font-size:12px;backdrop-filter:blur(12px)}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top"><input id="search" placeholder="Search city, place, coordinates, device ID, Cell ID, NCI…"><button class="btn" id="searchBtn">Search</button><button class="btn" id="gpsBtn">Start Live GPS</button></div>
  <div class="status" id="status">READY · LIVE GPS OFF</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
