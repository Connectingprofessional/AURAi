<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackMeNow — Map Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{overflow:hidden;background:#081018;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.top{position:fixed;z-index:1000;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px;width:min(850px,calc(100% - 24px));padding:7px;border-radius:13px;background:rgba(8,15,23,.84);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.3)}
input{flex:1;min-width:0;border:0;outline:0;border-radius:8px;padding:11px 12px;background:#14202b;color:#fff;font-size:14px}.btn{border:0;border-radius:8px;padding:0 13px;background:#1976ff;color:#fff;font-weight:700;cursor:pointer}.btn.stop{background:#a52c38}
.legend{position:fixed;z-index:999;right:12px;top:76px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}.layer{border:1px solid rgba(255,255,255,.12);background:rgba(8,15,23,.8);color:#dce8f4;border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer;backdrop-filter:blur(10px)}.layer.on{background:rgba(25,118,255,.9)}
.status{position:fixed;z-index:999;left:12px;bottom:12px;padding:8px 10px;border-radius:9px;background:rgba(8,15,23,.8);color:#dce8f4;font-size:11px;backdrop-filter:blur(10px)}
.leaflet-control-attribution{font-size:9px}
#cameraPanel{position:fixed;z-index:1200;right:14px;bottom:14px;width:min(360px,calc(100% - 28px));padding:10px;border-radius:12px;background:rgba(8,15,23,.94);color:#e7f1fb;box-shadow:0 12px 40px rgba(0,0,0,.45);backdrop-filter:blur(14px)}#cameraPanel[hidden]{display:none}.cameraHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cameraHead button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}#cameraDevice{width:100%;margin-bottom:8px;padding:8px;border-radius:7px;background:#14202b;color:#fff;border:1px solid #263746}#cameraVideo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#020609}.cameraActions{display:flex;gap:6px;margin-top:8px}.cameraActions .btn{padding:8px 9px}.cameraInfo{font-size:10px;color:#9db1c4;margin-top:7px;line-height:1.35}</style></head>
<body>
<div id="map"></div>
<div class="top"><input id="search" placeholder="Search city, place, coordinates, device ID, Cell ID, NCI…"><button class="btn" id="searchBtn">Search</button><button class="btn" id="gpsBtn">Locate Me</button><button class="btn" id="cameraBtn">📷 Camera</button></div>
<div class="legend" id="layers">
<button class="layer on" data-layer="flights">✈ Flights</button><button class="layer on" data-layer="ships">⚓ Ships</button><button class="layer on" data-layer="public-transport">🚌 Public Transport</button><button class="layer" data-layer="rail">🚆 Rail & Metro</button><button class="layer" data-layer="cameras">📷 Public Cameras</button><button class="layer" data-layer="cells">📡 Public Cells / Towers</button><button class="layer" data-layer="infrastructure">🏗 Global Assets</button><button class="layer" data-layer="road">🚗 Road Traffic</button>
</div>
<div class="status" id="status">MAP · LIVE FEEDS READY</div><div id="cameraPanel" hidden><div class="cameraHead"><b>MY CAMERA</b><button id="cameraClose">×</button></div><select id="cameraDevice"><option value="">Default camera</option></select><video id="cameraVideo" autoplay playsinline muted></video><div class="cameraActions"><button class="btn" id="cameraStart">Start</button><button class="btn" id="cameraShare">Broadcast</button><button class="btn stop" id="cameraStop">Stop</button></div><div class="cameraInfo" id="cameraInfo">Only cameras you explicitly authorize are accessible.</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./app.js"></script>
</body></html>
