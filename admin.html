<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackMeNow Admin Visibility</title>
<style>
body{margin:0;background:#071018;color:#eaf3f7;font:13px system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,button{height:38px;border:1px solid #30414c;background:#0d1821;color:#fff;border-radius:7px;padding:0 12px}button{cursor:pointer}.cards{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.card{padding:12px 16px;background:#0d1821;border:1px solid #263843;border-radius:8px}.card b{display:block;font-size:20px}.table{overflow:auto;border:1px solid #263843;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:9px;border-bottom:1px solid #1d2b34;text-align:left;white-space:nowrap}th{background:#0d1821}.muted{color:#91a6b1}
</style></head><body><main class="wrap">
<h2>TrackMeNow · Admin Visibility</h2>
<div class="top"><input id="user" placeholder="Admin login"><input id="pass" type="password" placeholder="Admin password"><button id="login">Login</button><button id="autorefresh" style="display:none">Auto refresh</button><input id="token" type="password" placeholder="Admin token" style="display:none"><button id="load" style="display:none">Load logs</button><button id="summary" style="display:none">30-day summary</button><button id="feeds" style="display:none">Feed report</button><span id="status" class="muted">Protected admin view</span></div>
<div id="cards" class="cards"></div><div class="table"><table><thead><tr><th>Time</th><th>Event</th><th>IP</th><th>Approx region</th><th>Tab</th><th>Sub</th><th>Details</th><th>Search</th><th>User agent</th><th>Referrer</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
const $=id=>document.getElementById(id);const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?location.origin:'https://wispy-bush-9aee.recreationeeraj.workers.dev';function hdr(){return {'X-Admin-Token':$('token').value.trim()}}function setAuth(t){$('token').value=t;['load','summary','feeds','autorefresh'].forEach(id=>$(id).style.display='inline-block');$('user').style.display='none';$('pass').style.display='none';$('login').style.display='none'}
async function load(){const r=await fetch(API+'/api/admin/logs?limit=500',{headers:hdr()});const j=await r.json();if(!r.ok)throw Error(j.error||'Unauthorized');$('rows').innerHTML=(j.rows||[]).map(x=>'<tr><td>'+esc(x.timestamp||x.occurred_at)+'</td><td>'+esc(x.event)+'</td><td>'+esc(x.ip)+'</td><td>'+esc([x.city,x.region,x.country].filter(Boolean).join(', '))+'</td><td>'+esc(x.tab||'')+'</td><td>'+esc(x.sub||'')+'</td><td>'+esc(x.detail||'')+'</td><td>'+esc(x.search_masked||'')+'</td><td title="'+esc(x.user_agent)+'">'+esc((x.user_agent||'').slice(0,90))+'</td><td>'+esc(x.referer||'')+'</td></tr>').join('');$('status').textContent='Loaded '+(j.rows||[]).length+' records'}
async function summary(){const r=await fetch(API+'/api/admin/summary',{headers:hdr()});const j=await r.json();if(!r.ok)throw Error(j.error||'Unauthorized');$('cards').innerHTML=(j.days||[]).map(x=>'<div class="card"><b>'+esc(x.visits)+'</b>visits · '+esc(String(x.day).slice(0,10))+'<div class="muted">'+esc(x.unique_ips)+' unique IPs · '+esc(x.searches)+' searches</div></div>').join('')}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('autorefresh').onclick=()=>{clearInterval(window.__tmAdminRefresh);window.__tmAdminRefresh=setInterval(()=>load().catch(()=>{}),10000);$('status').textContent='Auto refresh enabled · every 10s'};
$('login').onclick=async()=>{try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');setAuth(j.token);$('status').textContent='Authenticated';load().catch(e=>$('status').textContent=e.message);summary().catch(()=>{});}catch(e){$('status').textContent=e.message}};
$('feeds').onclick=async()=>{try{const r=await fetch(API+'/api/admin/feed-report',{headers:hdr()});const j=await r.json();if(!r.ok)throw Error(j.error||'Unauthorized');$('cards').innerHTML='<div class="card"><b>FEEDS</b>'+esc(JSON.stringify(j.feeds))+'</div><div class="card"><b>DATABASE</b>'+esc(String(j.database))+'</div>';}catch(e){$('status').textContent=e.message}};
$('load').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('summary').onclick=()=>summary().catch(e=>$('status').textContent=e.message);
</script></body></html>
